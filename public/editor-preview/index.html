<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jacadi Paris — Preview</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a2a4a;
        --muted: #5c5c5c;
        --line: #e8e8e8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--ink);
        background: #fff;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 18px 28px;
        border-bottom: 1px solid var(--line);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .logo {
        font-size: 22px;
        letter-spacing: 0.18em;
        font-weight: 500;
      }
      nav {
        display: flex;
        gap: 18px;
        color: var(--muted);
      }
      .hero {
        position: relative;
        min-height: 70vh;
        background: #9bb7c9 center / cover no-repeat;
        background-image: url("./hero.png");
      }
      .hero-copy {
        position: absolute;
        right: 8%;
        top: 42%;
        transform: translateY(-50%);
        max-width: 320px;
        color: var(--ink);
      }
      .heading_h3,
      .text-heading-3 {
        margin: 0 0 10px;
        font-size: 36px;
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 1.15;
      }
      .hero-copy a {
        color: var(--ink);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
      .section {
        max-width: 960px;
        margin: 0 auto;
        padding: 56px 24px;
        text-align: center;
      }
      .section h2 {
        margin: 0 0 12px;
        font-size: 32px;
        font-weight: 400;
      }
      .section p {
        margin: 0 auto;
        max-width: 420px;
        color: var(--muted);
        line-height: 1.6;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 960px;
        margin: 0 auto 64px;
        padding: 0 24px;
      }
      .card {
        aspect-ratio: 1;
        background: linear-gradient(160deg, #d9e6ef, #f4f7fa);
        border: 1px solid var(--line);
      }
      footer {
        border-top: 1px solid var(--line);
        padding: 28px;
        text-align: center;
        color: var(--muted);
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px;
      }
      /* Editor hover / select outlines live in the parent overlay */
      [data-editor-hover] {
        outline: 1px dashed rgba(0, 0, 0, 0.35);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <span>Fille</span>
        <span>Garçon</span>
        <span>Bébé</span>
      </nav>
      <div class="logo">JACADI</div>
      <nav>
        <span>Recherche</span>
        <span>Compte</span>
        <span>Panier</span>
      </nav>
    </header>
    <section class="hero" aria-label="Hero">
      <div class="hero-copy">
        <h3 class="heading_h3 text-heading-3">BALADE EN RÉ</h3>
        <a href="#collection">Découvrir</a>
      </div>
    </section>
    <section class="section" id="collection">
      <h2>Petite île</h2>
      <p>Une collection douce pour l’été — aperçu local pour l’éditeur.</p>
    </section>
    <div class="grid">
      <div class="card"></div>
      <div class="card"></div>
      <div class="card"></div>
    </div>
    <footer>Preview website · editor wireframe</footer>
  </body>
</html>
